# Netlify configuration.
#
# `base` matters more than it looks. Netlify decides which language runtimes
# to install by looking for manifests in the base directory, and this
# repository has Package.swift at its root — so with base unset, Netlify
# concluded it should build a Swift package, tried to fetch Swift 5.4 for
# Ubuntu 24.04, got a 404 page instead of a tarball and failed before it
# ever reached the site. Hoot is a macOS app; there is nothing here for a
# Linux builder to compile.
#
# Pointing base at the page's own folder means Netlify sees one HTML file,
# installs nothing, and publishes it.
[build]
  base = "Website/public"
  publish = "."

# No build command on purpose: no framework, no bundler, no dependencies.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Content-Type is deliberately not set. Netlify already sends the right type
# per file, and forcing one across "/*" would label any image as HTML.
